<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Archive Reader</title>
<style>
  body { background: #121212; color: #e0e0e0; font-family: monospace; margin: 0; padding: 0; }
  #door { box-sizing: border-box; width: 100vw; height: 100vh; padding: 40px; display: flex; flex-direction: column; justify-content: center; }
  fieldset { border: 1px solid #555; padding: 30px; max-width: 600px; width: 100%; margin: auto; }
  input, button, progress { font-family: monospace; background: #222; color: #fff; border: 1px solid #666; padding: 8px; margin-top: 10px; }
  button:hover { background: #333; cursor: pointer; }
  progress { width: 100%; height: 20px; accent-color: #888; }
  iframe { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; border: none; display: none; background: #000; }
  #fs { position: fixed; top: 10px; right: 10px; z-index: 999999; display: none; margin: 0; }
  :fullscreen #fs, :-webkit-full-screen #fs { display: none !important; pointer-events: none !important; }
</style>
</head>
<body>

<div id="door">
  <fieldset>
    <legend>Archive Reader</legend>
    <p>Select a .zip file containing an index.html document.</p>
    <div>
      <label for="f">File:</label>
      <input type="file" id="f" accept=".zip">
    </div>
    <br>
    <div>
      <button id="play">Play</button>
    </div>
    <br>
    <div id="status-box" style="display:none;">
      <div id="log">Waiting...</div>
      <progress id="prog" value="0" max="100"></progress>
    </div>
  </fieldset>
</div>

<button id="fs" onclick="document.documentElement.requestFullscreen()">Fullscreen</button>
<iframe id="view" sandbox="allow-scripts allow-same-origin allow-forms allow-pointer-lock allow-modals"></iframe>

<script>
const mimes = { html:'text/html', htm:'text/html', js:'application/javascript', mjs:'application/javascript', css:'text/css', json:'application/json', png:'image/png', jpg:'image/jpeg', jpeg:'image/jpeg', gif:'image/gif', svg:'image/svg+xml', webp:'image/webp', mp3:'audio/mpeg', ogg:'audio/ogg', wav:'audio/wav', wasm:'application/wasm', txt:'text/plain', xml:'text/xml' };
const getMime = n => mimes[n.split('.').pop().toLowerCase()] || 'application/octet-stream';

async function inflate(buf) {
  const ds = new DecompressionStream('deflate-raw');
  const w = ds.writable.getWriter();
  w.write(buf); w.close();
  return new Uint8Array(await new Response(ds.readable).arrayBuffer());
}

document.getElementById('play').onclick = async () => {
  const file = document.getElementById('f').files[0];
  if (!file) return alert('No file chosen.');
  
  const log = document.getElementById('log');
  const prog = document.getElementById('prog');
  document.getElementById('status-box').style.display = 'block';
  
  log.textContent = 'Reading ' + file.name + '...';
  const buf = await file.arrayBuffer();
  const view = new DataView(buf);
  const bytes = new Uint8Array(buf);
  const dec = new TextDecoder();

  let eocd = -1;
  for (let i = bytes.length - 22; i >= 0; i--) {
    if (view.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  }
  if (eocd === -1) return log.textContent = 'Error: Invalid zip file.';

  const total = view.getUint16(eocd + 10, true);
  let ptr = view.getUint32(eocd + 16, true);
  prog.max = total + 2;

  const files = {};
  for (let i = 0; i < total; i++) {
    if (view.getUint32(ptr, true) !== 0x02014b50) break;
    const method = view.getUint16(ptr + 10, true);
    const compSize = view.getUint32(ptr + 20, true);
    const nameLen = view.getUint16(ptr + 28, true);
    const extraLen = view.getUint16(ptr + 30, true);
    const commentLen = view.getUint16(ptr + 32, true);
    const localOffset = view.getUint32(ptr + 42, true);
    const name = dec.decode(bytes.subarray(ptr + 46, ptr + 46 + nameLen));
    ptr += 46 + nameLen + extraLen + commentLen;

    if (name.endsWith('/')) continue;
    log.textContent = `Unzipping [${i + 1}/${total}]: ${name}`;
    prog.value = i + 1;

    const lNameLen = view.getUint16(localOffset + 26, true);
    const lExtraLen = view.getUint16(localOffset + 28, true);
    const dataStart = localOffset + 30 + lNameLen + lExtraLen;
    const raw = bytes.subarray(dataStart, dataStart + compSize);

    let data = method === 0 ? raw : method === 8 ? await inflate(raw) : null;
    if (!data) continue;
    files[name] = { data, mime: getMime(name) };
  }

  const indexKey = Object.keys(files).find(k => k === 'index.html' || k.endsWith('/index.html'));
  if (!indexKey) return log.textContent = 'Error: index.html not found in archive.';

  log.textContent = 'Mapping local asset blobs...';
  prog.value = total + 1;
  const base = indexKey.includes('/') ? indexKey.slice(0, indexKey.lastIndexOf('/') + 1) : '';
  const urls = {};
  for (const [k, v] of Object.entries(files)) {
    const rel = k.startsWith(base) ? k.slice(base.length) : k;
    urls[rel] = URL.createObjectURL(new Blob([v.data], { type: v.mime }));
  }

  log.textContent = 'Rewriting paths and booting index.html...';
  prog.value = total + 2;
  let html = dec.decode(files[indexKey].data);
  const sortedPaths = Object.keys(urls).sort((a, b) => b.length - a.length);
  for (const rel of sortedPaths) {
    if (rel === 'index.html') continue;
    const esc = rel.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
    html = html.replace(new RegExp(`(["'(=])(\\.\\/)?${esc}(["')\\s?])`, 'g'), `$1${urls[rel]}$3`);
  }

  const mainBlob = URL.createObjectURL(new Blob([html], { type: 'text/html' }));
  const iframe = document.getElementById('view');
  iframe.onload = () => {
    document.getElementById('door').style.display = 'none';
    iframe.style.display = 'block';
    document.getElementById('fs').style.display = 'block';
  };
  iframe.src = mainBlob;
};

document.addEventListener('fullscreenchange', () => {
  const fsBtn = document.getElementById('fs');
  const isFs = !!document.fullscreenElement;
  fsBtn.style.display = isFs ? 'none' : 'block';
  fsBtn.style.pointerEvents = isFs ? 'none' : 'auto';
});
</script>
</body>
</html>
